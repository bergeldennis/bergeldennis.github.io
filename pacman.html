<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>PAC-MAN</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  :root{
    --ink:#05060f;
    --panel:#0a0c1c;
    --maze:#2431ff;
    --pac:#ffdf2e;
    --amber:#ffc46b;
    --dim:#8f8cb8;
    --red:#ff3b3b;
    --pink:#ffb8de;
    --cyan:#00e6e6;
    --orange:#ffb852;
    --mono:"Cascadia Mono","Consolas","Menlo","DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% 0%, #0b0e24 0%, var(--ink) 55%) fixed,
      var(--ink);
    color:var(--dim);
    font-family:var(--mono);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
  }
  .cab{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:14px 12px;max-width:640px;width:100%;
  }
  .marquee{
    font-weight:700;
    font-size:clamp(26px,6vw,40px);
    letter-spacing:.35em;
    margin-right:-.35em; /* re-center after tracking */
    color:var(--pac);
    text-shadow:
      0 0 6px rgba(255,223,46,.9),
      0 0 22px rgba(255,180,20,.45),
      0 0 60px rgba(255,140,0,.25);
  }
  .hud{
    width:100%;
    display:flex;justify-content:space-between;align-items:flex-end;
    gap:12px;
    font-size:clamp(11px,2.4vw,14px);
    letter-spacing:.14em;
    color:var(--amber);
    font-variant-numeric:tabular-nums;
  }
  .hud .lbl{display:block;font-size:.72em;color:var(--dim);letter-spacing:.22em;margin-bottom:2px}
  .hud .num{text-shadow:0 0 10px rgba(255,196,107,.5)}
  .lives{display:flex;gap:6px;align-items:center;min-height:16px}
  .life{
    width:14px;height:14px;border-radius:50%;
    background:conic-gradient(from 125deg,var(--pac) 0deg 290deg,#0000 290deg 360deg);
    filter:drop-shadow(0 0 4px rgba(255,223,46,.6));
  }
  .screen{
    position:relative;
    border-radius:14px;
    padding:10px;
    background:#02030a;
    box-shadow:
      inset 0 0 40px rgba(20,30,120,.35),
      0 0 0 2px #131736,
      0 0 34px rgba(36,49,255,.18),
      0 18px 50px rgba(0,0,0,.6);
    line-height:0;
  }
  canvas{
    display:block;
    width:auto;height:auto;
    max-width:min(94vw,540px);
    max-height:min(66dvh,600px);
    aspect-ratio:28/31;
    image-rendering:pixelated;
  }
  .crt{
    position:absolute;inset:10px;border-radius:8px;pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px),
      radial-gradient(115% 115% at 50% 45%, transparent 62%, rgba(0,0,0,.42) 100%);
    mix-blend-mode:multiply;
  }
  .foot{
    font-size:clamp(10px,2.2vw,12px);
    letter-spacing:.18em;
    color:var(--dim);
    display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;
  }
  .foot b{color:var(--amber);font-weight:600}
  button.key{
    font-family:inherit;font-size:inherit;letter-spacing:inherit;
    background:none;border:1px solid #23264a;border-radius:6px;
    color:var(--dim);padding:4px 10px;cursor:pointer;
  }
  button.key:hover{color:var(--amber);border-color:#3a3f7a}
  button.key:focus-visible{outline:2px solid var(--pac);outline-offset:2px}
  .dpad{display:none;gap:8px;margin-top:2px}
  @media (pointer:coarse){ .dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,48px)} }
  .dpad button{
    font-family:inherit;font-size:20px;color:var(--amber);
    background:#0c0f24;border:1px solid #23264a;border-radius:10px;cursor:pointer;
  }
  .dpad button:active{background:#181c3f}
  .dpad .up{grid-column:2;grid-row:1}
  .dpad .left{grid-column:1;grid-row:2}
  .dpad .down{grid-column:2;grid-row:2}
  .dpad .right{grid-column:3;grid-row:2}
  @media (prefers-reduced-motion: reduce){
    .marquee,.hud .num,.life{text-shadow:none;filter:none}
  }
</style>

<div class="cab">
  <div class="marquee">PAC-MAN</div>

  <div class="hud">
    <div><span class="lbl">SCORE</span><span class="num" id="score">00</span></div>
    <div><span class="lbl">HI-SCORE</span><span class="num" id="hiscore">00</span></div>
    <div><span class="lbl">LEVEL</span><span class="num" id="level">1</span></div>
    <div><span class="lbl">LIVES</span><span class="lives" id="lives"></span></div>
  </div>

  <div class="screen">
    <canvas id="game" width="560" height="620" aria-label="Pac-Man game board"></canvas>
    <div class="crt"></div>
  </div>

  <div class="foot">
    <span><b>ARROWS/WASD</b> MOVE</span>
    <span><b>P</b> PAUSE</span>
    <button class="key" id="mute" aria-label="Toggle sound"><b>M</b> SOUND ON</button>
  </div>

  <div class="dpad" aria-label="Touch controls">
    <button class="up"    data-d="0,-1" aria-label="Up">â–²</button>
    <button class="left"  data-d="-1,0" aria-label="Left">â—€</button>
    <button class="down"  data-d="0,1"  aria-label="Down">â–¼</button>
    <button class="right" data-d="1,0"  aria-label="Right">â–¶</button>
  </div>
</div>

<script>
'use strict';
/* ================= MAP ================= */
const RAW = [
"############################",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#o####.#####.##.#####.####o#",
"#.####.#####.##.#####.####.#",
"#..........................#",
"#.####.##.########.##.####.#",
"#.####.##.########.##.####.#",
"#......##....##....##......#",
"######.##### ## #####.######",
"######.##### ## #####.######",
"######.##          ##.######",
"######.## ###--### ##.######",
"######.## #      # ##.######",
"      .   #      #   .      ",
"######.## #      # ##.######",
"######.## ######## ##.######",
"######.##          ##.######",
"######.## ######## ##.######",
"######.## ######## ##.######",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#.####.#####.##.#####.####.#",
"#o..##.......  .......##..o#",
"###.##.##.########.##.##.###",
"###.##.##.########.##.##.###",
"#......##....##....##......#",
"#.##########.##.##########.#",
"#.##########.##.##########.#",
"#..........................#",
"############################",
];
const COLS = 28, ROWS = 31, T = 20;
const MAP = RAW.map(r => (r + " ".repeat(COLS)).slice(0, COLS));

const wrapX = tx => ((tx % COLS) + COLS) % COLS;
const tileAt = (tx, ty) => (ty < 0 || ty >= ROWS) ? '#' : MAP[ty][wrapX(tx)];
const walkable = (tx, ty) => { const c = tileAt(tx, ty); return c !== '#' && c !== '-'; };

/* ================= STATE ================= */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const DIRS = [{x:0,y:-1},{x:-1,y:0},{x:0,y:1},{x:1,y:0}]; // up,left,down,right (tie priority)

let pellets, powers, totalDots, dotsEaten;
let score = 0, hi = +(localStorage.getItem('pacman-hi') || 0), lives = 3, level = 1;
let state = 'attract';        // attract | ready | play | dying | clear | gameover
let stateT = 0;               // seconds in current state
let fright = 0, combo = 0;    // frightened timer, ghost-eat combo
let modeIdx = 0, modeT = 0;   // scatter/chase schedule
const MODE = [7, 20, 7, 20, 5, 20, 5, Infinity]; // even idx = scatter
let fruit = null;             // {x,y,t}
let popups = [];              // {x,y,txt,t,col}
let wakaFlip = false, muted = localStorage.getItem('pacman-mute') === '1';

const pac = { x:14, y:23.5, dir:{x:0,y:0}, next:{x:0,y:0}, mouth:0, deathT:0 };

const GHOST_DEFS = [
  { name:'blinky', col:'#ff3b3b', corner:{x:25,y:0},  home:{x:14,   y:11.5}, delay:0   },
  { name:'pinky',  col:'#ffb8de', corner:{x:2, y:0},  home:{x:14,   y:14.5}, delay:1   },
  { name:'inky',   col:'#00e6e6', corner:{x:27,y:30}, home:{x:12,   y:14.5}, delay:4.5 },
  { name:'clyde',  col:'#ffb852', corner:{x:0, y:30}, home:{x:16,   y:14.5}, delay:7.5 },
];
let ghosts = [];

function resetActors(fullLevel){
  pac.x = 14; pac.y = 23.5; pac.dir = {x:0,y:0}; pac.next = {x:-1,y:0}; pac.mouth = 0;
  ghosts = GHOST_DEFS.map((d, i) => ({
    ...d,
    x: d.home.x, y: d.home.y,
    dir: {x:-1, y:0},
    state: i === 0 ? 'play' : 'house',   // blinky starts outside
    frightened: false,
    release: d.delay,
    bob: Math.random() * Math.PI * 2,
    t: 0,
  }));
  fright = 0; combo = 0; modeIdx = 0; modeT = 0;
  if (fullLevel){
    pellets = new Set(); powers = new Set();
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
      if (MAP[y][x] === '.') pellets.add(y * COLS + x);
      if (MAP[y][x] === 'o') powers.add(y * COLS + x);
    }
    totalDots = pellets.size + powers.size; dotsEaten = 0; fruit = null;
  }
  popups = [];
}

/* ================= AUDIO ================= */
let AC = null;
function ac(){ if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function beep(f0, f1, dur, type, vol){
  if (muted) return;
  try{
    const a = ac(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(vol || .08, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + .02);
  }catch(e){}
}
const sfx = {
  waka(){ beep(wakaFlip ? 440 : 330, wakaFlip ? 220 : 165, .07, 'square', .05); wakaFlip = !wakaFlip; },
  power(){ beep(180, 700, .35, 'sawtooth', .07); },
  ghost(){ beep(300, 1200, .25, 'square', .08); },
  fruit(){ beep(600, 900, .15, 'triangle', .09); },
  death(){ beep(650, 60, .9, 'sawtooth', .1); },
  ready(){ beep(330, 330, .12, 'square', .06); setTimeout(() => beep(440, 440, .12, 'square', .06), 140); setTimeout(() => beep(550, 550, .2, 'square', .06), 280); },
};

/* ================= HUD ================= */
const $ = id => document.getElementById(id);
function hud(){
  $('score').textContent = score.toString().padStart(2, '0');
  $('hiscore').textContent = hi.toString().padStart(2, '0');
  $('level').textContent = level;
  const L = $('lives'); L.innerHTML = '';
  for (let i = 0; i < Math.max(0, lives - 1); i++){ const d = document.createElement('span'); d.className = 'life'; L.appendChild(d); }
}
function addScore(n){ score += n; if (score > hi){ hi = score; localStorage.setItem('pacman-hi', hi); } hud(); }

/* ================= INPUT ================= */
function setDir(x, y){
  pac.next = {x, y};
  if (pac.dir.x === -x && pac.dir.y === -y && (x || y)) pac.dir = {x, y}; // instant reverse
  if (state === 'attract' || state === 'gameover') startGame();
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const map = { arrowup:[0,-1], w:[0,-1], arrowleft:[-1,0], a:[-1,0], arrowdown:[0,1], s:[0,1], arrowright:[1,0], d:[1,0] };
  if (map[k]){ e.preventDefault(); ac(); setDir(...map[k]); return; }
  if (k === 'enter' || k === ' '){ e.preventDefault(); ac(); if (state === 'attract' || state === 'gameover') startGame(); else if (k === ' ') togglePause(); }
  if (k === 'p') togglePause();
  if (k === 'm') toggleMute();
});
let paused = false;
function togglePause(){ if (state === 'play' || state === 'ready') paused = !paused; }
function toggleMute(){
  muted = !muted; localStorage.setItem('pacman-mute', muted ? '1' : '0');
  $('mute').innerHTML = '<b>M</b> SOUND ' + (muted ? 'OFF' : 'ON');
}
$('mute').addEventListener('click', () => { ac(); toggleMute(); });
if (muted) $('mute').innerHTML = '<b>M</b> SOUND OFF';
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });

// touch: swipe + dpad
let tS = null;
cv.addEventListener('touchstart', e => { ac(); tS = {x:e.touches[0].clientX, y:e.touches[0].clientY}; if (state === 'attract' || state === 'gameover') startGame(); }, {passive:true});
cv.addEventListener('touchend', e => {
  if (!tS) return;
  const dx = e.changedTouches[0].clientX - tS.x, dy = e.changedTouches[0].clientY - tS.y;
  if (Math.abs(dx) + Math.abs(dy) > 24){
    if (Math.abs(dx) > Math.abs(dy)) setDir(Math.sign(dx), 0); else setDir(0, Math.sign(dy));
  }
  tS = null;
}, {passive:true});
document.querySelectorAll('.dpad button').forEach(b => {
  const [x, y] = b.dataset.d.split(',').map(Number);
  b.addEventListener('touchstart', e => { e.preventDefault(); ac(); setDir(x, y); }, {passive:false});
  b.addEventListener('click', () => { ac(); setDir(x, y); });
});
cv.addEventListener('pointerdown', () => { ac(); if (state === 'attract' || state === 'gameover') startGame(); });

/* ================= GAME FLOW ================= */
function startGame(){
  score = 0; lives = 3; level = 1;
  resetActors(true); hud();
  state = 'ready'; stateT = 0; paused = false;
  sfx.ready();
}
function nextLife(){
  lives--; hud();
  if (lives <= 0){ state = 'gameover'; stateT = 0; return; }
  resetActors(false);
  state = 'ready'; stateT = 0;
}
function nextLevel(){
  level++; hud();
  resetActors(true);
  state = 'ready'; stateT = 0;
  sfx.ready();
}

/* ================= SPEEDS ================= */
const spdScale = () => Math.min(1.24, 1 + (level - 1) * .04);
function pacSpeed(){ return 7.5 * spdScale(); }
function ghostSpeed(g){
  if (g.state === 'eyes') return 14;
  let s = 6.8 * spdScale();
  if (fright > 0 && g.frightened) s = 4.6;
  if (Math.floor(g.y) === 14 && (g.x < 6 || g.x > 22)) s *= .55; // tunnel
  return s;
}

/* ================= MOVEMENT ================= */
function canGo(tx, ty, d){ return walkable(tx + d.x, ty + d.y); }

function pacAtCenter(){
  const tx = Math.floor(pac.x), ty = Math.floor(pac.y);
  if ((pac.next.x || pac.next.y) && canGo(tx, ty, pac.next)) pac.dir = {...pac.next};
  if (!canGo(tx, ty, pac.dir)) pac.dir = {x:0, y:0};
}

function ghostTarget(g){
  if (g.state === 'eyes') return {x:13, y:11};
  if (fright > 0 && g.frightened) return null;
  const chase = (modeIdx % 2) === 1;
  if (!chase) return g.corner;
  const pt = {x:Math.floor(pac.x), y:Math.floor(pac.y)};
  const pd = (pac.dir.x || pac.dir.y) ? pac.dir : {x:-1, y:0};
  switch (g.name){
    case 'blinky': return pt;
    case 'pinky':  return {x:pt.x + pd.x * 4, y:pt.y + pd.y * 4};
    case 'inky': {
      const b = ghosts[0];
      const px = pt.x + pd.x * 2, py = pt.y + pd.y * 2;
      return {x:px * 2 - Math.floor(b.x), y:py * 2 - Math.floor(b.y)};
    }
    case 'clyde': {
      const dx = pt.x - Math.floor(g.x), dy = pt.y - Math.floor(g.y);
      return (dx * dx + dy * dy > 64) ? pt : g.corner;
    }
  }
}

function ghostAtCenter(g){
  const tx = Math.floor(g.x), ty = Math.floor(g.y);
  if (g.state === 'eyes' && ty === 11 && (tx === 13 || tx === 14)){
    g.state = 'enter'; g.x = tx + .5; g.y = 11.5; g.dir = {x:0, y:0}; return;
  }
  const opts = DIRS.filter(d => !(d.x === -g.dir.x && d.y === -g.dir.y) && canGo(tx, ty, d));
  if (!opts.length){ g.dir = {x:-g.dir.x, y:-g.dir.y}; return; }
  const target = ghostTarget(g);
  if (!target){ g.dir = opts[(Math.random() * opts.length) | 0]; return; }
  let best = opts[0], bd = Infinity;
  for (const d of opts){
    const dx = tx + d.x - target.x, dy = ty + d.y - target.y, v = dx * dx + dy * dy;
    if (v < bd){ bd = v; best = d; }
  }
  g.dir = best;
}

function gridMove(e, dt, speed, atCenter){
  let dist = speed * dt, guard = 0;
  while (dist > 1e-6 && (e.dir.x || e.dir.y) && guard++ < 10){
    let next, cur, axis;
    if (e.dir.x){ e.y = Math.floor(e.y) + .5; cur = e.x; axis = 'x';
      next = e.dir.x > 0 ? Math.floor(cur + .5) + .5 : Math.ceil(cur - .5) - .5;
    } else { e.x = Math.floor(e.x) + .5; cur = e.y; axis = 'y';
      next = e.dir.y > 0 ? Math.floor(cur + .5) + .5 : Math.ceil(cur - .5) - .5;
    }
    const d = Math.abs(next - cur);
    const step = Math.min(d, dist);
    e[axis] = cur + (axis === 'x' ? e.dir.x : e.dir.y) * step;
    dist -= step;
    if (step >= d - 1e-9){ e[axis] = next; atCenter(e); }
    if (e.x < -0.5) e.x += COLS; else if (e.x > COLS + 0.5) e.x -= COLS;
  }
}

/* ================= UPDATE ================= */
function eatAt(tx, ty){
  const k = ty * COLS + wrapX(tx);
  if (pellets.has(k)){ pellets.delete(k); addScore(10); dotsEaten++; sfx.waka(); onDot(); }
  else if (powers.has(k)){
    powers.delete(k); addScore(50); dotsEaten++; onDot();
    fright = Math.max(2, 7 - (level - 1) * .6); combo = 0;
    for (const g of ghosts){ if (g.state !== 'eyes' && g.state !== 'enter'){ g.frightened = true; if (g.state === 'play') g.dir = {x:-g.dir.x, y:-g.dir.y}; } }
    sfx.power();
  }
}
function onDot(){
  if ((dotsEaten === 70 || dotsEaten === 170) && !fruit) fruit = {x:14, y:17.5, t:9};
  if (dotsEaten >= totalDots){ state = 'clear'; stateT = 0; }
}

function update(dt){
  stateT += dt;
  if (state === 'ready'){ if (stateT > 1.8){ state = 'play'; stateT = 0; } return; }
  if (state === 'dying'){
    pac.deathT += dt;
    if (pac.deathT > 1.5) nextLife();
    return;
  }
  if (state === 'clear'){ if (stateT > 2.2) nextLevel(); return; }
  if (state !== 'play') return;

  // mode schedule (paused while frightened)
  if (fright > 0){
    fright -= dt;
    if (fright <= 0){ fright = 0; for (const g of ghosts) g.frightened = false; }
  } else {
    modeT += dt;
    if (modeT >= MODE[modeIdx] && modeIdx < MODE.length - 1){
      modeT = 0; modeIdx++;
      for (const g of ghosts) if (g.state === 'play') g.dir = {x:-g.dir.x, y:-g.dir.y};
    }
  }

  // pac
  pac.mouth += dt * 10;
  if (!pac.dir.x && !pac.dir.y) pacAtCenter();
  gridMove(pac, dt, pacSpeed(), pacAtCenter);
  eatAt(Math.floor(pac.x), Math.floor(pac.y));

  // fruit
  if (fruit){
    fruit.t -= dt;
    if (fruit.t <= 0) fruit = null;
    else {
      const dx = pac.x - fruit.x, dy = pac.y - fruit.y;
      if (dx * dx + dy * dy < .8){
        const pts = Math.min(1000, 100 + (level - 1) * 200);
        addScore(pts); popups.push({x:fruit.x, y:fruit.y, txt:pts, t:1.2, col:'#ff7bac'});
        fruit = null; sfx.fruit();
      }
    }
  }

  // ghosts
  for (const g of ghosts){
    g.t += dt;
    if (g.state === 'house'){
      g.release -= dt;
      g.bob += dt * 5;
      g.y = g.home.y + Math.sin(g.bob) * .3;
      if (g.release <= 0) g.state = 'exit';
    } else if (g.state === 'exit'){
      const sp = 3.5 * dt;
      if (Math.abs(g.x - 14) > .05) g.x += Math.sign(14 - g.x) * Math.min(sp, Math.abs(g.x - 14));
      else { g.x = 14; g.y -= sp; if (g.y <= 11.5){ g.y = 11.5; g.state = 'play'; g.dir = {x: Math.random() < .5 ? -1 : 1, y:0}; } }
    } else if (g.state === 'enter'){
      const sp = 8 * dt;
      if (Math.abs(g.x - 14) > .05) g.x += Math.sign(14 - g.x) * Math.min(sp, Math.abs(g.x - 14));
      else { g.x = 14; g.y += sp; if (g.y >= 14.5){ g.y = 14.5; g.state = 'house'; g.release = .4; g.frightened = false; g.bob = 0; } }
    } else {
      gridMove(g, dt, ghostSpeed(g), ghostAtCenter);
    }
  }

  // collisions
  for (const g of ghosts){
    if (g.state !== 'play') continue;
    const dx = pac.x - g.x, dy = pac.y - g.y;
    if (dx * dx + dy * dy < .55){
      if (fright > 0 && g.frightened){
        const pts = 200 * Math.pow(2, combo); combo = Math.min(3, combo + 1);
        addScore(pts); popups.push({x:g.x, y:g.y, txt:pts, t:1, col:'#7cf0ff'});
        g.state = 'eyes'; g.frightened = false; sfx.ghost();
      } else {
        state = 'dying'; stateT = 0; pac.deathT = 0; sfx.death();
        return;
      }
    }
  }

  for (const p of popups) p.t -= dt;
  popups = popups.filter(p => p.t > 0);
}

/* ================= RENDER ================= */
// prerender maze walls (blue + white flash variants)
function buildMaze(color){
  const off = document.createElement('canvas');
  off.width = COLS * T; off.height = ROWS * T;
  const c = off.getContext('2d');
  c.lineWidth = 3; c.lineCap = 'round'; c.strokeStyle = color;
  c.shadowColor = color; c.shadowBlur = 7;
  const isWall = (x, y) => (x < 0 || x >= COLS || y < 0 || y >= ROWS) ? false : MAP[y][x] === '#';
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
    if (!isWall(x, y)) continue;
    const cx = x * T + T / 2, cy = y * T + T / 2;
    let drew = false;
    for (const [dx, dy] of [[1,0],[0,1]]){
      if (isWall(x + dx, y + dy)){
        c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + dx * T, cy + dy * T); c.stroke(); drew = true;
      }
    }
    if (isWall(x - 1, y) || isWall(x, y - 1)) drew = true;
    if (!drew){ c.beginPath(); c.arc(cx, cy, 3, 0, 7); c.stroke(); }
  }
  // ghost door
  c.shadowBlur = 4; c.strokeStyle = '#ffb8de'; c.shadowColor = '#ffb8de';
  c.beginPath(); c.moveTo(13 * T, 12 * T + T / 2); c.lineTo(15 * T, 12 * T + T / 2); c.stroke();
  return off;
}
const mazeBlue = buildMaze('#2431ff');
const mazeWhite = buildMaze('#d8dcff');

const px = v => v * T;

function drawGhost(g){
  const x = px(g.x), y = px(g.y), r = T * .48;
  const eyesOnly = g.state === 'eyes';
  const frightAct = fright > 0 && g.frightened;
  const flash = frightAct && fright < 2 && (Math.floor(fright * 6) % 2 === 0);
  if (!eyesOnly){
    const body = frightAct ? (flash ? '#eef0ff' : '#2431ff') : g.col;
    ctx.fillStyle = body;
    ctx.shadowColor = body; ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(x - r, y + r * .95);
    ctx.lineTo(x - r, y - r * .1);
    ctx.arc(x, y - r * .1, r, Math.PI, 0);
    ctx.lineTo(x + r, y + r * .95);
    const w = (2 * r) / 6;
    const wig = Math.sin(g.t * 12) > 0 ? 0 : w / 2; // feet wiggle
    for (let i = 0; i < 6; i++){
      const fx = x + r - (i + 1) * w + (i < 5 ? wig : 0) * ((i % 2) ? -1 : 1);
      ctx.lineTo(fx, (i % 2 === 0) ? y + r * .62 : y + r * .95);
    }
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
  }
  // eyes
  const ex = r * .36, ey = -r * .18, er = r * .3;
  const pdx = g.dir.x * er * .38, pdy = g.dir.y * er * .38;
  if (frightAct && !eyesOnly){
    ctx.fillStyle = flash ? '#ff3b3b' : '#ffd9a8';
    for (const s of [-1, 1]){ ctx.beginPath(); ctx.arc(x + s * ex, y + ey, er * .45, 0, 7); ctx.fill(); }
    // wavy mouth
    ctx.strokeStyle = flash ? '#ff3b3b' : '#ffd9a8'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 6; i++){
      const mx = x - r * .6 + (i / 6) * r * 1.2, my = y + r * .38 + ((i % 2) ? -2.5 : 2.5);
      i ? ctx.lineTo(mx, my) : ctx.moveTo(mx, my);
    }
    ctx.stroke();
  } else {
    for (const s of [-1, 1]){
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(x + s * ex, y + ey, er * .85, er, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#1b2bd0';
      ctx.beginPath(); ctx.arc(x + s * ex + pdx, y + ey + pdy, er * .45, 0, 7); ctx.fill();
    }
  }
}

function drawFruit(f){
  const x = px(f.x), y = px(f.y);
  ctx.save();
  if (f.t < 2 && Math.floor(f.t * 5) % 2 === 0) ctx.globalAlpha = .3;
  ctx.strokeStyle = '#3fae4a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.quadraticCurveTo(x + 6, y - 12, x + 8, y - 6); ctx.stroke();
  ctx.fillStyle = '#ff2e4d'; ctx.shadowColor = '#ff2e4d'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(x - 4, y + 3, 5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 5, y + 5, 5, 0, 7); ctx.fill();
  ctx.restore();
}

function text(str, x, y, size, col, glow){
  ctx.fillStyle = col;
  ctx.font = `700 ${size}px ${'"Cascadia Mono","Consolas","Menlo",monospace'}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (glow){ ctx.shadowColor = col; ctx.shadowBlur = 14; }
  ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
}

let blinkT = 0;
function render(dt){
  blinkT += dt;
  ctx.clearRect(0, 0, cv.width, cv.height);

  // maze
  const flashWhite = state === 'clear' && Math.floor(stateT * 4) % 2 === 1;
  ctx.drawImage(flashWhite ? mazeWhite : mazeBlue, 0, 0);

  if (state === 'attract'){
    ctx.fillStyle = 'rgba(2,3,10,.72)'; ctx.fillRect(0, 0, cv.width, cv.height);
    text('PAC-MAN', cv.width / 2, 150, 34, '#ffdf2e', true);
    const roster = [['blinky','#ff3b3b','SHADOW'],['pinky','#ffb8de','SPEEDY'],['inky','#00e6e6','BASHFUL'],['clyde','#ffb852','POKEY']];
    roster.forEach((r, i) => {
      const gy = 230 + i * 46;
      drawGhost({x:9.2, y:gy / T, dir:{x:1,y:0}, state:'play', frightened:false, col:r[1], t:blinkT + i});
      ctx.textAlign = 'left';
      ctx.fillStyle = r[1]; ctx.font = '700 15px monospace';
      ctx.fillText('"' + r[0].toUpperCase() + '"  ' + r[2], 220, gy + 5);
    });
    if (Math.floor(blinkT * 2) % 2 === 0)
      text('PRESS ENTER OR TAP TO START', cv.width / 2, 470, 16, '#ffc46b', true);
    text('HI-SCORE  ' + hi, cv.width / 2, 520, 13, '#8f8cb8', false);
    return;
  }

  // pellets
  ctx.fillStyle = '#ffd9a8';
  for (const k of pellets){
    const x = k % COLS, y = (k / COLS) | 0;
    ctx.fillRect(x * T + T / 2 - 1.5, y * T + T / 2 - 1.5, 3, 3);
  }
  if (Math.floor(blinkT * 4) % 2 === 0){
    ctx.shadowColor = '#ffd9a8'; ctx.shadowBlur = 8;
    for (const k of powers){
      const x = k % COLS, y = (k / COLS) | 0;
      ctx.beginPath(); ctx.arc(x * T + T / 2, y * T + T / 2, 5.5, 0, 7); ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  if (fruit) drawFruit(fruit);

  // pac
  if (state === 'dying'){
    const p = Math.min(1, pac.deathT / 1.1);
    const m = .25 + p * (Math.PI - .25);
    if (p < 1){
      ctx.fillStyle = '#ffdf2e'; ctx.shadowColor = '#ffdf2e'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(px(pac.x), px(pac.y));
      ctx.arc(px(pac.x), px(pac.y), T * .55, -Math.PI / 2 + m, -Math.PI / 2 - m + Math.PI * 2);
      ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
    }
  } else if (state !== 'clear' || stateT < .3){
    const m = (pac.dir.x || pac.dir.y) ? Math.abs(Math.sin(pac.mouth)) * .32 * Math.PI + .04 : .22 * Math.PI;
    const a = Math.atan2(pac.dir.y, (pac.dir.x || pac.dir.y) ? pac.dir.x : -1);
    ctx.fillStyle = '#ffdf2e'; ctx.shadowColor = '#ffdf2e'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(px(pac.x), px(pac.y));
    ctx.arc(px(pac.x), px(pac.y), T * .55, a + m, a - m + Math.PI * 2);
    ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
  }

  // ghosts
  if (state !== 'dying' && state !== 'clear') for (const g of ghosts) drawGhost(g);

  // popups
  for (const p of popups) text(p.txt, px(p.x), px(p.y) - (1 - p.t) * 14, 12, p.col, true);

  // overlays
  if (state === 'ready') text('READY!', cv.width / 2, 17.5 * T, 20, '#ffdf2e', true);
  if (state === 'gameover'){
    text('GAME  OVER', cv.width / 2, 17.5 * T, 22, '#ff3b3b', true);
    if (Math.floor(blinkT * 2) % 2 === 0)
      text('PRESS ENTER TO RETRY', cv.width / 2, 20.5 * T, 13, '#ffc46b', false);
  }
  if (paused) text('PAUSED', cv.width / 2, 17.5 * T, 20, '#8f8cb8', true);
}

/* ================= LOOP ================= */
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (!paused) update(dt);
  render(dt);
  requestAnimationFrame(loop);
}
hud();
requestAnimationFrame(loop);
</script>
